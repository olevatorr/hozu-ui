<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 210 250" role="img" aria-label="Peg in a suit and bow tie, waving"><style>
.peg{animation:bob 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:75px 236px}
.eyes{animation:blink 5.2s infinite;transform-box:view-box;transform-origin:77px 98px}
.wave{animation:wave 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:128px 160px}
.bow{animation:bow 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:75px 156px}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes bow{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-10deg)}92%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
