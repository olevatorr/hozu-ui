<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 250 290" role="img" aria-label="Peg in a suit and bow tie, presenting a button on a tray"><style>
.peg{animation:bob 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:75px 236px}
.eyes{animation:blink 5.2s infinite;transform-box:view-box;transform-origin:77px 98px}
.tray{animation:tray 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:150px 20px}
.spark{animation:spark 2.6s ease-in-out infinite}
.bow{}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tray{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes spark{0%,40%,100%{opacity:0}55%,75%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
